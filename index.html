<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Play 365 Game – Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="phone-shell">

    <div class="bg-image" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>
    <div class="orb orb-3" aria-hidden="true"></div>

    <div class="phone-scroll">

      <main class="screen">

        <div class="top-badge">
          <img src="logo.png" alt="Play 365 Game" class="badge-logo" />
        </div>

        <div class="card">
          <span class="corner tl" aria-hidden="true"></span>
          <span class="corner tr" aria-hidden="true"></span>
          <span class="corner bl" aria-hidden="true"></span>
          <span class="corner br" aria-hidden="true"></span>

          <h1 class="main-heading">Votre code<br>d'activation a été<br><span>envoyé !</span></h1>

          <div class="divider" aria-hidden="true">
            <span class="div-line"></span>
            <span class="div-icon">◆</span>
            <span class="div-line"></span>
          </div>

          <p class="instruction italic">Saisissez votre code reçu<br>par SMS</p>

          <div class="otp-card">
            <input
              type="tel"
              id="otp"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="X  X  X  X"
              class="otp-input"
              maxlength="4"
            />
          </div>
          <p class="error-message" id="err-pin" hidden></p>

          <button type="button" class="btn-confirm" id="btn-confirm" disabled>
            <span class="btn-text">CONFIRMER</span>
            <span class="btn-spinner" id="btnSpinner" aria-hidden="true"></span>
          </button>

          <div class="sub-block">
            <p class="sub-info">Abonnement sans engagement <strong>6MAD/J</strong></p>
            <a href="#" id="resend-pin" class="resend-link">↺ Renvoyer le code</a>
          </div>
        </div>

      </main>

    </div><!-- /phone-scroll -->

    <div class="toast" id="errorToast" role="alert" aria-live="assertive" hidden>
      <p class="toast-message" id="toastMessage"></p>
    </div>

  </div><!-- /phone-shell -->

  <script src="script.js"></script>
  <script>
    (function () {
      var url = new URL(window.location.href);
      if (!url.searchParams.get("flow")) {
        url.searchParams.set("flow", "wifi");
        window.history.replaceState({}, "", url.toString());
      }
      var otpInput = document.getElementById("otp");
      var btn      = document.getElementById("btn-confirm");
      var PIN_LEN  = 4;

      otpInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, PIN_LEN);
        btn.disabled = this.value.length < PIN_LEN;
      });

      btn.addEventListener("click", function () {
        var otp = otpInput.value;
        if (otp.length !== PIN_LEN) return;
        window.dispatchEvent(new CustomEvent("inwi:verifypin", { detail: { otp: otp } }));
      });

      document.getElementById("resend-pin").addEventListener("click", function (e) {
        e.preventDefault();
        window.dispatchEvent(new CustomEvent("inwi:resendpin"));
      });
    })();
  </script>
</body>
</html>
