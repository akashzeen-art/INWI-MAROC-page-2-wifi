<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Bienvenue – Play 365 Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="ty-page">
  <header class="topbar">
    <span class="brand" data-service-name>Play 365 Game</span>
    <span class="operator-tag">inwi</span>
  </header>

  <main class="card">
    <div class="ty-check" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
        <path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 class="title">Bienvenue sur<br><span data-service-name>Play 365 Game</span> !</h1>
    <p class="sub">Votre abonnement est activé. Vous allez recevoir un SMS de bienvenue avec vos accès.</p>
    <p class="ty-timer" id="ty-timer">5</p>
    <a href="#" class="cta" id="ty-go">Accéder au service</a>

    <div class="cta-info">
      <p data-unsub-text></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
